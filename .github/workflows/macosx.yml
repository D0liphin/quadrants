name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      debug_tmate:
        description: "Open an interactive tmate session on the runner (instead of the auto repro)."
        required: false
        default: "false"
      wheel_run_id:
        description: "Run id to download the prebuilt (built-from-main) mac wheel from."
        required: false
        default: "30635690618"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # [DONOTMERGE] diagnostic branch for the vulkan SIMT f64 subgroup SIGABRT
  # (test_subgroup_inclusive_mul_tiled[arch=vulkan, dtype=f64] -> Abort trap: 6). Confirmed
  # to reproduce ONLY on a wheel built from main (the published 1.2.0 raises a clean
  # "Type f64 not supported" instead), and ONLY after the full vulkan suite accumulates
  # (test_simt.py alone does not crash). To avoid a ~16-min rebuild every iteration this
  # DOWNLOADS the prebuilt main wheel from a prior build run (wheel_run_id) instead of
  # building. Set debug_tmate=true (workflow_dispatch) to open an interactive tmate session.
  vulkan_simt_crash:
    name: Vulkan SIMT crash repro
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.12']
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}
      - name: Download prebuilt main wheel from a prior build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -ex
          RID="${{ github.event.inputs.wheel_run_id }}"
          RID="${RID:-30635690618}"
          gh run download "$RID" --repo "${{ github.repository }}" -n mac_wheel_26_cp312 -D dist
          gh run download "$RID" --repo "${{ github.repository }}" -n mac_cpptests_26_cp312 -D build || true
          ls -la dist build 2>/dev/null || true
      - name: Install prebuilt wheel
        run: |
          bash .github/workflows/scripts_new/macosx/3_install.sh
      - name: Interactive tmate session (dispatch-gated)
        if: ${{ github.event.inputs.debug_tmate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "830"
        run: |
          bash .github/workflows/scripts_new/macosx/tmate_debug.sh
      - name: Vulkan SIMT crash diagnostics
        if: ${{ github.event.inputs.debug_tmate != 'true' }}
        run: |
          bash .github/workflows/scripts_new/macosx/vulkan_simt_crash.sh
      - name: Upload crash reports + stage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan_simt_crash_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: |
            ${{ runner.temp }}/crash_reports
            ${{ runner.temp }}/stage_results.txt
          if-no-files-found: warn

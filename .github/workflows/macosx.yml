name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      quadrants_version:
        description: "quadrants version to pip install from PyPI (blank = latest --pre). Use this to bracket the CI-slowdown regression, e.g. 1.1.2 (pre-Jul21) vs 1.2.0 (post)."
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # NOTE: Experimental [DONOTMERGE] diagnostics branch. build_mac and publish_pypi are
  # removed; the test job installs a prebuilt wheel from PyPI (saves ~15-18 min) so we
  # can iterate on the Mac test slowdown quickly.
  test:
    name: Test on Mac
    # A/B experiment: same code, NO daemon changes (QD_FIX defaults to none) - the only
    # variable is the runner size. macos-26 is the standard 3-vCPU arm64 runner where
    # teardown balloons to 150-380s; macos-26-xlarge is a 5-vCPU M2 Pro. Tests directly
    # whether the CPU run-queue oversubscription (hundreds of runnable daemon threads vs
    # 3 cores) is relieved by having more cores.
    strategy:
      fail-fast: false
      matrix:
        RUNNER: [macos-26, macos-26-xlarge]
        PYTHON_VERSION: ['3.12']
    runs-on: ${{ matrix.RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION}}
      - name: Install prebuilt quadrants wheel from PyPI
        env:
          QD_VERSION: ${{ github.event.inputs.quadrants_version }}
        run: |
          bash .github/workflows/scripts_new/macosx/3_install.sh
      - name: Mac OS X test
        run: |
          bash .github/workflows/scripts_new/macosx/4_test.sh
      - name: Upload resource sampler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_resource_log_${{ matrix.RUNNER }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/resource_sampler.log
          if-no-files-found: warn
      - name: Upload deep captures (thread/fd/stack dumps on load spike)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_deep_capture_${{ matrix.RUNNER }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/deep_capture
          if-no-files-found: warn

name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      quadrants_version:
        description: "quadrants version to pip install from PyPI (blank = latest --pre). Use this to bracket the CI-slowdown regression, e.g. 1.1.2 (pre-Jul21) vs 1.2.0 (post)."
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # NOTE: Experimental [DONOTMERGE] diagnostics branch. build_mac and publish_pypi are
  # removed; the test job installs a prebuilt wheel from PyPI (saves ~15-18 min) so we
  # can iterate on the Mac test slowdown quickly.
  test:
    name: Test on Mac
    # Within-VM A/B: run the SAME phase-1 workload twice back-to-back in one job - once
    # with per-worker thread pools capped to 1 (candidate) and once uncapped
    # (baseline: reproduces the collapse). Same VM for both arms, so the bimodal
    # runner-lottery variance that confounds separate control/fix legs is cancelled.
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.12']
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    # Two full phase-1 runs; on a bad VM the baseline arm can be long. The candidate arm
    # runs first so it is always captured.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION}}
      - name: Install prebuilt quadrants wheel from PyPI
        env:
          QD_VERSION: ${{ github.event.inputs.quadrants_version }}
        run: |
          bash .github/workflows/scripts_new/macosx/3_install.sh
      - name: Mac OS X within-VM A/B (thread-capped vs in-process)
        run: |
          bash .github/workflows/scripts_new/macosx/withinvm_ab.sh
      - name: Upload resource sampler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_resource_log_withinvm_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/resource_sampler.log
          if-no-files-found: warn
      - name: Upload within-VM timings + summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_withinvm_timings_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: |
            ${{ runner.temp }}/withinvm_summary.txt
            ${{ runner.temp }}/file_timing_threadcap.md
            ${{ runner.temp }}/file_timing_baseline.md
          if-no-files-found: warn
      - name: Upload deep captures (thread/fd/stack dumps on load spike)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_deep_capture_withinvm_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/deep_capture
          if-no-files-found: warn

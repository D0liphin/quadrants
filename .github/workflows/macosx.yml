name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      quadrants_version:
        description: "quadrants version to pip install from PyPI (blank = latest --pre). Use this to bracket the CI-slowdown regression, e.g. 1.1.2 (pre-Jul21) vs 1.2.0 (post)."
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # NOTE: This is an experimental [DONOTMERGE] diagnostics branch. The build_mac and
  # publish_pypi jobs have been removed; the test job installs a prebuilt wheel from
  # PyPI instead of building from source (saves ~15-18 min), so we can iterate on the
  # intermittent Mac test slowdown quickly.
  #
  # PRE-ONSET BRACKET: this branch pins the wheel to 1.1.3 (released Jul 17, before the
  # Jul 21 onset commit bbefab1b13 / PR #796) AND checks out the matching v1.1.3 test
  # tree, for a clean A/B against hp/mac-ci-slowdown-diagnostics (matched 1.2.0). If this
  # arm is fast, the regression is in the codebase (1.1.3 -> 1.2.0), not the runner env.
  test:
    name: Test on Mac
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.10', '3.11', '3.12', '3.13']
        include:
          - MAC_OS_VERSION: 15
            PYTHON_VERSION: '3.10'
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION}}
      - name: Install prebuilt quadrants wheel from PyPI
        env:
          # Default to the pre-onset 1.1.3 wheel for pull_request runs; dispatch can override.
          QD_VERSION: ${{ github.event.inputs.quadrants_version || '1.1.3' }}
        run: |
          bash .github/workflows/scripts_new/macosx/3_install.sh
      - name: Mac OS X test
        run: |
          bash .github/workflows/scripts_new/macosx/4_test.sh
      - name: Upload resource sampler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_resource_log_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/resource_sampler.log
          if-no-files-found: warn
      - name: Upload deep captures (thread/fd/stack dumps on load spike)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_deep_capture_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/deep_capture
          if-no-files-found: warn

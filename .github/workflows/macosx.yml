name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      quadrants_version:
        description: "quadrants version to pip install from PyPI (blank = latest --pre)."
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # [DONOTMERGE] diagnostic branch (based on main so the PR is conflict-free and CI runs).
  # Digs into the vulkan SIMT subgroup SIGABRT
  # (test_subgroup_inclusive_mul_tiled[arch=vulkan, dtype=f64] -> Abort trap: 6) that a
  # single serial xdist worker exposes. Installs a prebuilt wheel from PyPI (no build) and
  # runs targeted vulkan-only repros with lldb + macOS .ips crash-report capture. All other
  # (non-mac) workflows are intentionally removed on this branch.
  vulkan_simt_crash:
    name: Vulkan SIMT crash repro
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.12']
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}
      - name: Install prebuilt quadrants wheel from PyPI
        env:
          QD_VERSION: ${{ github.event.inputs.quadrants_version }}
        run: |
          set -ex
          if [ -n "${QD_VERSION}" ]; then
            pip install --prefer-binary "quadrants==${QD_VERSION}"
          else
            pip install --prefer-binary --pre --upgrade quadrants
          fi
          python -c "import quadrants as qd; qd.init(arch=qd.vulkan)"
      - name: Vulkan SIMT crash diagnostics
        run: |
          bash .github/workflows/scripts_new/macosx/vulkan_simt_crash.sh
      - name: Upload crash reports + stage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan_simt_crash_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: |
            ${{ runner.temp }}/crash_reports
            ${{ runner.temp }}/stage_results.txt
          if-no-files-found: warn

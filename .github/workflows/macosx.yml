name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      debug_tmate:
        description: "Open an interactive tmate session on the runner (instead of the auto repro)."
        required: false
        default: "false"
      wheel_run_id:
        description: "Run id to download the prebuilt (built-from-main) mac wheel from."
        required: false
        default: "30635690618"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # [DONOTMERGE] validate the vendor-scoped VkInstance fix: the immortal-VkInstance workaround is now
  # scoped to NVIDIA (its actual driver bug); on MoltenVK the instance is destroyed+recreated per
  # qd.init()/qd.reset() cycle so per-VkDevice Metal state can't accumulate on the shared MTLDevice.
  # This job BUILDS from this branch (C++ changed) and runs the leak-localization probes: pre-fix all
  # three (bare/field/kernel) hard-abort at ~2900 cycles; if the fix works they should run PAST 2900
  # (to the cycle cap or the per-stage timeout) with NO rc=134 / no .ips.
  vulkan_leak_probe:
    name: Vulkan leak localization
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.12']
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}
      - name: Mac OS X prerequisites
        run: |
          bash .github/workflows/scripts_new/macosx/1_prerequisites.sh
      - name: Mac OS X build (from this branch, includes vendor-scoped VkInstance fix)
        run: |
          bash .github/workflows/scripts_new/macosx/2_build.sh
      - name: Upload built wheel (so re-runs can skip the ~16m rebuild)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instancefix_mac_wheel_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: dist
          if-no-files-found: warn
      - name: Mac OS X install
        run: |
          bash .github/workflows/scripts_new/macosx/3_install.sh
      - name: Interactive tmate session (dispatch-gated)
        if: ${{ github.event.inputs.debug_tmate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "830"
        run: |
          bash .github/workflows/scripts_new/macosx/tmate_debug.sh
      - name: Vulkan leak-localization probe
        if: ${{ github.event.inputs.debug_tmate != 'true' }}
        run: |
          bash .github/workflows/scripts_new/macosx/leak_probe.sh
      - name: Upload leak probe RSS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan_leak_probe_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/leak_out
          if-no-files-found: warn

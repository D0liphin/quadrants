name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      quadrants_version:
        description: "quadrants version to pip install from PyPI (blank = latest --pre). Use this to bracket the CI-slowdown regression, e.g. 1.1.2 (pre-Jul21) vs 1.2.0 (post)."
        required: false
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # NOTE: Experimental [DONOTMERGE] diagnostics branch. build_mac and publish_pypi are
  # removed; the test job installs a prebuilt wheel from PyPI (saves ~15-18 min) so we
  # can iterate on the Mac test slowdown quickly.
  test:
    name: Test on Mac
    # A/B experiment: MODE=control vs MODE=disable on the same (os, py). The disable arm
    # launchctl disable + bootout the macOS consumer-daemon swarm (fail-fast: a caller
    # gets "service unavailable" instead of the indefinite hang SIGSTOP caused). The fix
    # is confirmed if per-test teardown drops back to ~1s (from 150-380s) on disable legs.
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.12']
        MODE: [control, disable]
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION}}
      - name: Install prebuilt quadrants wheel from PyPI
        env:
          QD_VERSION: ${{ github.event.inputs.quadrants_version }}
        run: |
          bash .github/workflows/scripts_new/macosx/3_install.sh
      - name: Mac OS X test
        env:
          QD_FIX: ${{ matrix.MODE }}
        run: |
          bash .github/workflows/scripts_new/macosx/4_test.sh
      - name: Upload resource sampler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_resource_log_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}_${{ matrix.MODE }}
          path: ${{ runner.temp }}/resource_sampler.log
          if-no-files-found: warn
      - name: Upload deep captures (thread/fd/stack dumps on load spike)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac_deep_capture_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}_${{ matrix.MODE }}
          path: ${{ runner.temp }}/deep_capture
          if-no-files-found: warn

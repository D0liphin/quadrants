name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      debug_tmate:
        description: "Open an interactive tmate session on the runner (instead of the auto repro)."
        required: false
        default: "false"
      wheel_run_id:
        description: "Run id to download the prebuilt (built-from-main) mac wheel from."
        required: false
        default: "30635690618"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # [DONOTMERGE] capture the EXACT per-cycle Vulkan call sequence MoltenVK sees during qd.init()/
  # qd.reset() (MVK_CONFIG_TRACE_VULKAN_CALLS), so a standalone no-Quadrants C++ repro can mirror it
  # 1:1. Reuses the fix1 wheel from run 30659629369 (default immortal-instance behaviour; fix1 only
  # changed submit error handling, not the success-path call sequence) -> NO rebuild, ~5 min.
  vulkan_call_trace:
    name: Vulkan call trace
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.12']
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}
      - name: Download prebuilt fix(1) wheel (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: fix1_mac_wheel_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          run-id: 30659629369
          github-token: ${{ github.token }}
          path: dist
      - name: Install wheel
        run: |
          pip install -U pip
          pip install dist/*.whl
          python -c "import quadrants as qd; print('quadrants', getattr(qd,'__version__','?'))"
      - name: Trace Vulkan calls (3x qd.init/reset)
        run: |
          bash .github/workflows/scripts_new/macosx/trace_vk.sh
      - name: Upload Vulkan call trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan_call_trace_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/vktrace
          if-no-files-found: warn

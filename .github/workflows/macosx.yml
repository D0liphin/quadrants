name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      debug_tmate:
        description: "Open an interactive tmate session on the runner (instead of the auto repro)."
        required: false
        default: "false"
      wheel_run_id:
        description: "Run id to download the prebuilt (built-from-main) mac wheel from."
        required: false
        default: "30635690618"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # [DONOTMERGE] diagnostic branch validating fix(1) for the vulkan-leg SIGABRT.
  # Root cause (production .ips): VulkanStream::submit()'s vkQueueSubmit fails once process-wide
  # MoltenVK/Metal state accumulates across the suite, and BAIL_ON_VK_BAD_RESULT_NO_RETURN routed
  # that to RHI_ASSERT -> assert() -> abort() (hard crash, no traceback) inside a qd.reset()
  # teardown flush. fix(1) makes submit() throw QuadrantsRuntimeError instead. This job BUILDS
  # quadrants FROM THIS BRANCH (so the C++ change is included) and runs the serial (-t 1) vulkan
  # suite that reliably aborted: expect abort->recoverable exception (Stage 4b, no more .ips) and
  # fix(1)+worker-recycle to reach 100% (Stage 5). Also logs RSS per test (investigation 2).
  vulkan_simt_crash:
    name: Vulkan SIMT crash repro
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.12']
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    # Stages are individually `timeout`-bounded; keep the job ceiling comfortably above their sum
    # (build + probe + recycle + norecycle) so the always() artifact upload is never skipped.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}
      - name: Mac OS X prerequisites
        run: |
          bash .github/workflows/scripts_new/macosx/1_prerequisites.sh
      - name: Mac OS X build (from this branch, includes fix(1))
        run: |
          bash .github/workflows/scripts_new/macosx/2_build.sh
      - name: Upload built wheel (so re-runs can skip the ~16m rebuild)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix1_mac_wheel_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: dist
          if-no-files-found: warn
      - name: Mac OS X install
        run: |
          bash .github/workflows/scripts_new/macosx/3_install.sh
      - name: Interactive tmate session (dispatch-gated)
        if: ${{ github.event.inputs.debug_tmate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "830"
        run: |
          bash .github/workflows/scripts_new/macosx/tmate_debug.sh
      - name: Vulkan SIMT crash diagnostics
        if: ${{ github.event.inputs.debug_tmate != 'true' }}
        run: |
          bash .github/workflows/scripts_new/macosx/vulkan_simt_crash.sh
      - name: Upload crash reports + stage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan_simt_crash_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: |
            ${{ runner.temp }}/crash_reports
            ${{ runner.temp }}/stage_results.txt
          if-no-files-found: warn

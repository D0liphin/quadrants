name: Mac OS
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      debug_tmate:
        description: "Open an interactive tmate session on the runner (instead of the auto repro)."
        required: false
        default: "false"
      wheel_run_id:
        description: "Run id to download the prebuilt (built-from-main) mac wheel from."
        required: false
        default: "30635690618"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  # [DONOTMERGE] leak-localization for the vulkan/MoltenVK per-init/reset leak (~50 KB/cycle) that
  # ends in VK_ERROR_DEVICE_LOST. Reuses the fix(1) wheel already built by run 30659629369 (C++ is
  # unchanged; only shell scripts changed since) so there is NO 16-min rebuild -- just download +
  # pip install + run three RSS-vs-cycle probes (bare init/reset / +field / +kernel) in ~15 min.
  vulkan_leak_probe:
    name: Vulkan leak localization
    strategy:
      fail-fast: false
      matrix:
        MAC_OS_VERSION: [26]
        PYTHON_VERSION: ['3.12']
    runs-on: macos-${{ matrix.MAC_OS_VERSION }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Python check
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}
      - name: Download prebuilt fix(1) wheel (skip rebuild; C++ unchanged since run 30659629369)
        uses: actions/download-artifact@v4
        with:
          name: fix1_mac_wheel_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          run-id: 30659629369
          github-token: ${{ github.token }}
          path: dist
      - name: Install wheel
        run: |
          pip install -U pip
          pip install dist/*.whl
          python -c "import quadrants as qd; print('quadrants', getattr(qd,'__version__','?'))"
      - name: Interactive tmate session (dispatch-gated)
        if: ${{ github.event.inputs.debug_tmate == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "830"
        run: |
          bash .github/workflows/scripts_new/macosx/tmate_debug.sh
      - name: Vulkan leak-localization probe
        if: ${{ github.event.inputs.debug_tmate != 'true' }}
        run: |
          bash .github/workflows/scripts_new/macosx/leak_probe.sh
      - name: Upload leak probe RSS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan_leak_probe_${{ matrix.MAC_OS_VERSION }}_${{ matrix.PYTHON_VERSION }}
          path: ${{ runner.temp }}/leak_out
          if-no-files-found: warn
